<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body>
<header>
  <div class="brand">
    <svg class="emblem" viewBox="0 0 100 100" role="img" aria-label="Guitar pick">
      <defs>
        <linearGradient id="pick" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe1b0"/>
          <stop offset=".35" stop-color="#ff7a1c"/>
          <stop offset=".72" stop-color="#e1341e"/>
          <stop offset="1" stop-color="#5c130a"/>
        </linearGradient>
        <linearGradient id="pickrim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
          <stop offset=".32" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path class="e-shadow" d="M50 6C70 6 86 16 86 36 86 60 64 86 50 94 36 86 14 60 14 36 14 16 30 6 50 6Z"/>
      <path d="M50 6C70 6 86 16 86 36 86 60 64 86 50 94 36 86 14 60 14 36 14 16 30 6 50 6Z" fill="url(#pick)" stroke="#2a0d06" stroke-width="2.5"/>
      <path d="M50 6C70 6 86 16 86 36 86 60 64 86 50 94 36 86 14 60 14 36 14 16 30 6 50 6Z" fill="url(#pickrim)"/>
      <g stroke="#1c0a05" stroke-width="2.4" opacity=".5">
        <line x1="34" y1="30" x2="34" y2="74"/><line x1="50" y1="26" x2="50" y2="82"/><line x1="66" y1="30" x2="66" y2="74"/>
      </g>
      <g stroke="#ffe9c8" stroke-width=".8" opacity=".55">
        <line x1="35.1" y1="30" x2="35.1" y2="74"/><line x1="51.1" y1="26" x2="51.1" y2="82"/><line x1="67.1" y1="30" x2="67.1" y2="74"/>
      </g>
    </svg>
    <div class="brand-text">
      <h1>app</h1>
    </div>
  </div>
  <div class="header-right">
    <div class="vu" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span id="device-badge" class="badge"></span>
  </div>
</header>

<section class="card" id="dropzone">
  <div class="rivets" aria-hidden="true"></div>
  <!-- <p class="drop-title">Drop your tracks here <span>— or click</span></p> -->
  <p class="drop-sub">.mp3 · .wav · .mp4 · .m4a — 300MB</p>
  <input type="file" id="file-input" accept=".mp3,.wav,.mp4,.m4a,.flac,.ogg" multiple hidden>
  <div class="model-row" onclick="event.stopPropagation()">
    <div class="opt">
      <label>Model</label>
      <select id="model-select">
        <option value="bs_roformer_sw" selected>BS-Roformer-SW — 6 stems</option>
        <option value="htdemucs_ft">htdemucs_ft — 4 stems</option>
        <option value="htdemucs">htdemucs — 4 stems</option>
      </select>
    </div>
    <div class="opt">
      <label>Quality</label>
      <select id="quality-select">
        <option value="rapido">Fast</option>
        <option value="normal" selected>Normal</option>
        <option value="alta">High</option>
      </select>
    </div>
  </div>
  <div class="url-row" onclick="event.stopPropagation()">
    <input type="url" id="url-input" placeholder="URL" autocomplete="off">
    <button type="button" id="url-btn">Process</button>
  </div>
  <p id="upload-msg"></p>
</section>

<section id="processing-list"></section>

<h2>Processed songs</h2>
<div class="lib-bar">
  <input id="lib-search" type="search" placeholder="Search songs…" autocomplete="off">
  <select id="lib-sort" title="Sort">
    <option value="recent" selected>Recent</option>
    <option value="name">Name A-Z</option>
    <option value="duration">Duration</option>
  </select>
</div>
<section id="songs-list"><p class="empty">Loading…</p></section>
<p id="lib-empty" class="empty" hidden>No results.</p>

<script type="module" src="/static/app.js?v=9"></script>
</body>
</html>
